# Sole-owner gate — example CI integration for Handover.
#
# Keeps the departing engineer's knowledge from silently spreading: when a PR
# touches a module that the tracked person still solely owns, the job prints
# the risky modules with their evidence (and can fail the check).
#
# Setup:
#   1. Create a fine-grained PAT that can read your repos and save it as the
#      repository secret HANDOVER_GITHUB_TOKEN.
#   2. Set HANDOVER_USER to the departing engineer's GitHub username.
#   3. Optionally pin the tool version instead of cloning main.
name: Sole-owner gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      HANDOVER_USER: alice
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the tool
        run: |
          git clone --depth 1 https://github.com/a742987/Handover.git "$RUNNER_TEMP/handover"
          cd "$RUNNER_TEMP/handover"
          npm ci --omit=dev && npm run build
      - name: Build or refresh the index (cached between runs)
        run: |
          node "$RUNNER_TEMP/handover/dist/cli.js" collect "$HANDOVER_USER" \
            -r "$REPO" --data-dir "$RUNNER_TEMP/handover-data"
        env:
          GITHUB_TOKEN: ${{ secrets.HANDOVER_GITHUB_TOKEN }}
      - name: List changed files
        run: gh pr diff --name-only "$PR_NUMBER" > "$RUNNER_TEMP/changed.txt"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Gate
        id: gate
        run: |
          node "$RUNNER_TEMP/handover/dist/cli.js" gate "$HANDOVER_USER" \
            --data-dir "$RUNNER_TEMP/handover-data" \
            --files "$RUNNER_TEMP/changed.txt" --comment > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md"
          echo "touched=$(grep -c '^- \`' "$RUNNER_TEMP/comment.md" || true)" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR when risky modules were touched
        if: steps.gate.outputs.touched != '0'
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      # Uncomment to block merges until the sole owner has reviewed:
      # - name: Fail the check
      #   run: |
      #     node "$RUNNER_TEMP/handover/dist/cli.js" gate "$HANDOVER_USER" \
      #       --data-dir "$RUNNER_TEMP/handover-data" \
      #       --files "$RUNNER_TEMP/changed.txt" --fail-on-match
