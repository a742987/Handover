# Sole-owner gate — example CI integration for Handover.
#
# Keeps the departing engineer's knowledge from silently spreading: when a PR
# touches a module that the tracked person still solely owns, the job prints
# the risky modules with their evidence (and can fail the check).
#
# Setup:
#   1. Create a fine-grained PAT that can read your repos and save it as the
#      repository secret HANDOVER_GITHUB_TOKEN. Scope it to the repositories
#      being gated, contents:read only — this job never writes to git.
#   2. Set HANDOVER_USER to the departing engineer's GitHub username.
#   3. Set HANDOVER_VERSION to a published version of handover-book.
#
# Why the install step looks like this: cloning this repository and building it
# on every pull request would execute whatever is on main at that moment, with
# your PAT in the environment. Installing a published, pinned version from the
# registry means the code that runs is reviewable in advance and the version can
# only move when you move it. `--ignore-scripts` keeps a dependency's install
# hook out of the runner, and the shipped package is already built.
name: Sole-owner gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HANDOVER_USER: alice
      # REQUIRED: pin a published version, e.g. 0.1.3. Never "latest" here.
      HANDOVER_VERSION: ''
      REPO: ${{ github.repository }}
    steps:
      # Pinned to a commit SHA, same as the repository's own workflows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Refuse to run unpinned
        run: |
          set -euo pipefail
          if [ -z "$HANDOVER_VERSION" ] || [ "$HANDOVER_VERSION" = latest ]; then
            echo "set HANDOVER_VERSION to an exact published handover-book version" >&2
            exit 1
          fi

      - name: Install the pinned tool
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/handover" --no-audit --no-fund \
            --ignore-scripts "handover-book@$HANDOVER_VERSION"
          node "$RUNNER_TEMP/handover/node_modules/handover-book/dist/cli.js" --version

      - name: Build or refresh the index (fresh in RUNNER_TEMP every run)
        run: |
          node "$RUNNER_TEMP/handover/node_modules/handover-book/dist/cli.js" collect "$HANDOVER_USER" \
            -r "$REPO" --data-dir "$RUNNER_TEMP/handover-data"
        env:
          GITHUB_TOKEN: ${{ secrets.HANDOVER_GITHUB_TOKEN }}

      - name: List changed files
        run: gh pr diff --name-only "$PR_NUMBER" > "$RUNNER_TEMP/changed.txt"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Gate
        id: gate
        run: |
          node "$RUNNER_TEMP/handover/node_modules/handover-book/dist/cli.js" gate "$HANDOVER_USER" \
            --data-dir "$RUNNER_TEMP/handover-data" \
            --files "$RUNNER_TEMP/changed.txt" --comment > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md"
          echo "touched=$(grep -c '^- `' "$RUNNER_TEMP/comment.md" || true)" >> "$GITHUB_OUTPUT"

      - name: Comment on the PR when risky modules were touched
        if: steps.gate.outputs.touched != '0'
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # Uncomment to block merges until the sole owner has reviewed:
      # - name: Fail the check
      #   run: |
      #     node "$RUNNER_TEMP/handover/node_modules/handover-book/dist/cli.js" gate "$HANDOVER_USER" \
      #       --data-dir "$RUNNER_TEMP/handover-data" \
      #       --files "$RUNNER_TEMP/changed.txt" --fail-on-match
